services:
  - type: web
    name: rakshak-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: Fasal Rakshak AI
      - key: API_V1_STR
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DEMO_GATE_PASSWORD
        sync: false
      - key: BOOTSTRAP_DEMO_ACCOUNTS
        value: "true"
      - key: CORS_ORIGINS
        value: "https://stail-rakshakai.vercel.app"
      - key: S3_BUCKET_NAME
        value: fasal-rakshak-evidence
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QUALITY_BLUR_THRESHOLD
        value: "80.0"
      - key: MIN_USABLE_FRAMES_THRESHOLD
        value: "5"
      - key: MIN_VIDEO_DURATION_SECONDS
        value: "10.0"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "30.0"
      - key: MAX_UPLOAD_BYTES
        value: "104857600"
      - key: ALLOWED_VIDEO_EXTENSIONS
        value: ".mp4,.mov,.m4v,.avi"
      - key: LOCAL_STORAGE_DIR
        value: "/app/storage"
      - key: CELERY_CPU_QUEUE
        value: "cpu_processing"
    healthCheckPath: /healthz

  - type: redis
    name: rakshak-redis
    plan: free
