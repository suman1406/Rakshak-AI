x-runtime: &runtime
  DATABASE_URL: postgresql+psycopg://rakshak:rakshak@postgres:5432/rakshak
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: rakshak-local
  S3_SECRET_KEY: rakshak-local-only
  S3_BUCKET_NAME: rakshak-evidence
  S3_REGION: us-east-1
  LOCAL_STORAGE_DIR: /app/storage
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set a unique JWT_SECRET_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3005}
  ENVIRONMENT: docker
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
  INITIAL_ADMIN_PASSPHRASE: ${INITIAL_ADMIN_PASSPHRASE:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OMP_NUM_THREADS: 2
  MKL_NUM_THREADS: 2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rakshak
      POSTGRES_PASSWORD: rakshak
      POSTGRES_DB: rakshak
    ports: ['127.0.0.1:5433:5432']
    volumes: ['rakshak-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rakshak -d rakshak']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ['rakshak-redis:/data']
    ports: ['127.0.0.1:6380:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rakshak-local
      MINIO_ROOT_PASSWORD: rakshak-local-only
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['rakshak-minio:/data']
  storage-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ['/bin/sh', '-c']
    command: ['until mc alias set local http://minio:9000 rakshak-local rakshak-local-only; do sleep 2; done; mc mb --ignore-existing local/rakshak-evidence']
  backend:
    build: ./backend
    environment: *runtime
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
      storage-init: {condition: service_completed_successfully}
  worker:
    build: ./backend
    environment: *runtime
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 -Q cpu_processing,gpu_inference
    depends_on: [backend]
  scheduler:
    build: ./backend
    environment: *runtime
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on: [worker]
volumes:
  rakshak-postgres:
  rakshak-redis:
  rakshak-minio:
