services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rakshak
      POSTGRES_PASSWORD: rakshak
      POSTGRES_DB: rakshak
    ports: ["5433:5432"]
    volumes: ["rakshak-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakshak -d rakshak"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rakshak-minio:/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rakshak:rakshak@postgres:5432/rakshak
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: rakshak-evidence
      LOCAL_STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: 104857600
      CELERY_CPU_QUEUE: cpu_processing
      CELERY_GPU_QUEUE: gpu_inference
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env before starting Docker Compose}
      DEMO_GATE_PASSWORD: ${DEMO_GATE_PASSWORD:?Set DEMO_GATE_PASSWORD in .env before starting Docker Compose}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ENVIRONMENT: docker
    ports: ["8000:8000"]
    volumes:
      - rakshak-evidence-local:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info -Q cpu_processing,gpu_inference
    environment:
      DATABASE_URL: postgresql+psycopg://rakshak:rakshak@postgres:5432/rakshak
      REDIS_URL: redis://redis:6379/0
      CELERY_CPU_QUEUE: cpu_processing
      CELERY_GPU_QUEUE: gpu_inference
      LOCAL_STORAGE_DIR: /app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - rakshak-evidence-local:/app/storage
volumes:
  rakshak-postgres:
  rakshak-minio:
  rakshak-evidence-local:
