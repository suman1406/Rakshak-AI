services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rakshak
      POSTGRES_PASSWORD: rakshak
      POSTGRES_DB: rakshak
    ports: ["5432:5432"]
    volumes: ["rakshak-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rakshak-minio:/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://rakshak:rakshak@postgres:5432/rakshak
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rakshak-evidence
      JWT_SECRET: change-me
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://rakshak:rakshak@postgres:5432/rakshak
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
volumes:
  rakshak-postgres:
  rakshak-minio:

