# Fasal Rakshak — machine-readable task backlog.
# Mirrors Fasal_Rakshak_05_Agentic_Phase_Backlog.md. If they ever disagree,
# the markdown file is authoritative — update this file to match.
#
# Fields:
#   id: stable ticket ID, referenced in commits/PRs (FR-P<phase>-<seq>)
#   phase: integer 0-10, or "cross" for cross-cutting tickets
#   title: short description
#   track: BE | ML | Infra | Process | "BE+ML"
#   depends_on: list of ticket ids (or [] if none / phase-entry ticket)
#   guardrail_refs: list of Loopholes [L#] ids and/or source-doc section refs
#   acceptance_criteria: condensed Definition of Done
#   status: todo | in_progress | done | blocked  (agents/tools update this field)

