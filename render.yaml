# Review infrastructure cost and supply shared credentials before applying.
# Add DATABASE_URL, S3_ENDPOINT_URL, S3_ACCESS_KEY, S3_SECRET_KEY and
# CORS_ORIGINS to the rakshak-runtime environment group in Render.
envVarGroups:
  - name: rakshak-runtime
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: s3
      - key: BOOTSTRAP_DEMO_ACCOUNTS
        value: 'false'
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: S3_BUCKET_NAME
        value: fasal-rakshak-evidence
      - key: S3_REGION
        value: auto
      - key: EVIDENCE_RETENTION_DAYS
        value: '180'
      - key: LOCAL_STORAGE_DIR
        value: /app/storage
      - key: OMP_NUM_THREADS
        value: '2'
      - key: MKL_NUM_THREADS
        value: '2'
services:
  - type: web
    name: rakshak-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: 1c-2g
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - fromGroup: rakshak-runtime
      - key: REDIS_URL
        fromService: {name: rakshak-redis, type: keyvalue, property: connectionString}
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSPHRASE
        sync: false
  - type: worker
    name: rakshak-worker
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 -Q cpu_processing,gpu_inference
    plan: 1c-2g
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: rakshak-runtime
      - key: REDIS_URL
        fromService: {name: rakshak-redis, type: keyvalue, property: connectionString}
  - type: worker
    name: rakshak-scheduler
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: rakshak-runtime
      - key: REDIS_URL
        fromService: {name: rakshak-redis, type: keyvalue, property: connectionString}
  - type: keyvalue
    name: rakshak-redis
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
